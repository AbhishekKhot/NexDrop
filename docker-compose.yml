# NexDrop — Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up --build
#
# LAN Mode note:
#   mDNS multicast does not work in Docker's default bridge network.
#   For LAN peer discovery on Linux, uncomment `network_mode: host`
#   on the backend service. macOS/Windows Docker Desktop users must
#   run the backend natively for LAN mode.

name: nexdrop

services:

  # ── Backend Agent ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexdrop-backend:latest
    container_name: nexdrop-backend

    # Uncomment for LAN mode (mDNS) on Linux only:
    # network_mode: host

    ports:
      - "${TCP_PORT:-4000}:4000"        # LAN TCP transfers
      - "${WS_API_PORT:-4001}:4001"     # Browser ↔ agent bridge (localhost-only in prod)
      - "${SIGNALING_PORT:-4002}:4002"  # WebRTC signaling

    environment:
      TCP_PORT: ${TCP_PORT:-4000}
      WS_API_PORT: ${WS_API_PORT:-4001}
      SIGNALING_PORT: ${SIGNALING_PORT:-4002}
      DEVICE_NAME: ${DEVICE_NAME:-nexdrop-node}
      ALLOW_REMOTE_WS: ${ALLOW_REMOTE_WS:-false}
      WS_ALLOWED_ORIGIN: ${WS_ALLOWED_ORIGIN:-http://localhost:3000}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/downloads/NexDrop}
      SIGNALING_MAX_CONN_PER_IP: ${SIGNALING_MAX_CONN_PER_IP:-5}
      SIGNALING_MAX_MSG_PER_SEC: ${SIGNALING_MAX_MSG_PER_SEC:-20}
      SIGNALING_ROOM_TTL_MS: ${SIGNALING_ROOM_TTL_MS:-600000}

    volumes:
      - downloads:/downloads/NexDrop

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(parseInt(process.env.WS_API_PORT||'4001'),'localhost',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend Web UI ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked in at build time — set to production URLs
        VITE_AGENT_WS_URL: ${VITE_AGENT_WS_URL:-ws://localhost:4001}
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-ws://localhost:4002}
        VITE_STUN_SERVERS: ${VITE_STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        VITE_TURN_SERVER_URL: ${VITE_TURN_SERVER_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    image: nexdrop-frontend:latest
    container_name: nexdrop-frontend

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  downloads:
    driver: local
