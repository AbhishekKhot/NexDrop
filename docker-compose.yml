# NexDrop — Docker Compose (Remote relay + static frontend)
#
# Usage:
#   cp .env.example .env       # fill in RELAY_ALLOWED_ORIGIN at minimum
#   docker compose up --build  # → frontend on :3000, relay on 127.0.0.1:4002
#
# Brings up the WebSocket relay + a nginx-served frontend SPA. The relay
# listens on loopback by default; wire a TLS-terminating proxy (Caddy,
# Cloudflare Tunnel, Render's edge) in front for production. See DEPLOYMENT.md.
#
# LAN feature note: the LAN agent (mDNS + direct TCP) is currently line-commented
# in backend/src/. This compose file is Remote-only.

name: nexdrop

services:

  # ── Relay (Remote mode) ─────────────────────────────────────────────
  relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexdrop-relay:latest
    container_name: nexdrop-relay

    ports:
      - "127.0.0.1:${RELAY_PORT:-4002}:4002"   # loopback-only by default

    environment:
      RELAY_PORT: 4002
      RELAY_BIND_HOST: 0.0.0.0
      RELAY_ALLOWED_ORIGIN: ${RELAY_ALLOWED_ORIGIN:?must be set to your frontend origin}
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-false}
      RELAY_MAX_FILE_SIZE: ${RELAY_MAX_FILE_SIZE:-5368709120}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4002/', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Frontend (static SPA, served by nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* vars are baked in at build time.
        VITE_RELAY_URL: ${VITE_RELAY_URL:-ws://localhost:4002}
    image: nexdrop-frontend:latest
    container_name: nexdrop-frontend

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      relay:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
