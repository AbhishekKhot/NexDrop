services:
  - type: web
    name: nexdrop-relay
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/relay.js
    healthCheckPath: /
    envVars:
      - key: RELAY_BIND_HOST
        value: 0.0.0.0
      - key: RELAY_TRUST_PROXY
        value: "true"
      - key: RELAY_ALLOWED_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
